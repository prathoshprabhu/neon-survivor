<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON SURVIVOR 3D | 2087</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --neon-cyan: #00f7ff;
            --neon-pink: #ff00aa;
            --neon-purple: #9d00ff;
            --neon-green: #00ff6a;
            --neon-orange: #ff6a00;
            --dark-bg: #0a0a12;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            cursor: crosshair;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .hud {
            position: absolute;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
        }
        
        #topHud {
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .stat-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0,247,255,0.3);
        }
        
        .stat-icon { font-size: 20px; }
        
        .stat-bar {
            width: 150px;
            height: 12px;
            background: rgba(0,0,0,0.5);
            border-radius: 6px;
            overflow: hidden;
        }
        
        .stat-fill {
            height: 100%;
            transition: width 0.2s;
        }
        
        .health-fill { background: linear-gradient(90deg, #ff0044, #ff4466); }
        .shield-fill { background: linear-gradient(90deg, #00f7ff, #66f7ff); }
        
        .stat-text {
            font-size: 12px;
            color: var(--neon-cyan);
            min-width: 50px;
        }
        
        #weaponHud {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .weapon-slot {
            width: 55px;
            height: 55px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 22px;
        }
        
        .weapon-slot.active {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0,247,255,0.5);
        }
        
        .weapon-slot.locked { opacity: 0.3; }
        .weapon-key { font-size: 10px; color: rgba(255,255,255,0.5); }
        
        #scoreHud {
            top: 20px;
            right: 20px;
            text-align: right;
            background: rgba(0,0,0,0.6);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--neon-pink);
        }
        
        .score-label { font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 2px; }
        .score-value { font-size: 32px; color: var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink); }
        .kills-text { font-size: 14px; color: var(--neon-green); margin-top: 5px; }
        
        #ammoHud {
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--neon-orange);
        }
        
        .ammo-count { font-size: 28px; color: var(--neon-orange); }
        .ammo-label { font-size: 10px; color: rgba(255,255,255,0.5); }
        
        #minimapHud {
            bottom: 100px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0,0,0,0.7);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
        }
        
        #minimap { width: 100%; height: 100%; }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        .crosshair-dot {
            width: 4px;
            height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
        }
        
        .crosshair-line {
            position: absolute;
            background: var(--neon-cyan);
            box-shadow: 0 0 5px var(--neon-cyan);
        }
        
        .crosshair-line.top { width: 2px; height: 12px; top: -18px; left: 1px; }
        .crosshair-line.bottom { width: 2px; height: 12px; bottom: -18px; left: 1px; }
        .crosshair-line.left { width: 12px; height: 2px; left: -18px; top: 1px; }
        .crosshair-line.right { width: 12px; height: 2px; right: -18px; top: 1px; }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 30%, rgba(157,0,255,0.15) 0%, transparent 50%),
                        linear-gradient(180deg, #050508 0%, #0a0a12 100%);
            z-index: 100;
        }
        
        #gameOverScreen { display: none; background: rgba(5,5,8,0.95); }
        
        .game-title {
            font-family: 'Orbitron', monospace;
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .game-subtitle {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            color: var(--neon-cyan);
            letter-spacing: 8px;
            margin-bottom: 40px;
        }
        
        .start-button {
            padding: 18px 55px;
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            color: #fff;
            background: linear-gradient(135deg, rgba(157,0,255,0.3), rgba(0,247,255,0.3));
            border: 2px solid var(--neon-cyan);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        
        .start-button:hover {
            background: linear-gradient(135deg, rgba(157,0,255,0.5), rgba(0,247,255,0.5));
            box-shadow: 0 0 40px rgba(0,247,255,0.5);
            transform: scale(1.05);
        }
        
        .controls-info {
            margin-top: 35px;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
        
        .controls-info span { color: var(--neon-cyan); font-family: 'Orbitron', monospace; }
        
        .game-over-title { font-size: 56px; color: #ff0044; text-shadow: 0 0 40px rgba(255,0,68,0.7); margin-bottom: 20px; }
        .final-score { font-size: 32px; color: var(--neon-purple); margin-bottom: 35px; }
        
        #notification {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 35px;
            background: linear-gradient(135deg, rgba(0,255,106,0.2), rgba(0,247,255,0.2));
            border: 2px solid var(--neon-green);
            border-radius: 12px;
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            color: var(--neon-green);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 50;
        }
        
        #notification.show { opacity: 1; }
        
        #waveIndicator {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 10px 25px;
            border-radius: 10px;
            border: 1px solid var(--neon-purple);
        }
        
        .wave-text { font-size: 20px; color: var(--neon-purple); text-shadow: 0 0 15px var(--neon-purple); }
        .wave-enemies { font-size: 12px; color: rgba(255,255,255,0.6); }
        
        #damageOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(255,0,0,0.3) 100%);
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="startScreen">
        <h1 class="game-title">NEON SURVIVOR 3D</h1>
        <p class="game-subtitle">YEAR 2087</p>
        <button class="start-button" onclick="startGame()">ENTER THE MAZE</button>
        <div class="controls-info">
            <p><span>WASD / Arrows</span> Move | <span>MOUSE</span> Look | <span>CLICK</span> Shoot</p>
            <p><span>1-7</span> Weapons | <span>SHIFT</span> Sprint</p>
        </div>
    </div>
    
    <div id="gameOverScreen">
        <h1 class="game-title game-over-title">TERMINATED</h1>
        <p class="final-score">SCORE: <span id="finalScore">0</span></p>
        <button class="start-button" onclick="restartGame()">TRY AGAIN</button>
    </div>
    
    <div id="topHud" class="hud">
        <div class="stat-row">
            <span class="stat-icon">❤️</span>
            <div class="stat-bar"><div class="stat-fill health-fill" id="healthFill" style="width:100%"></div></div>
            <span class="stat-text" id="healthText">100</span>
        </div>
        <div class="stat-row">
            <span class="stat-icon">🛡️</span>
            <div class="stat-bar"><div class="stat-fill shield-fill" id="shieldFill" style="width:50%"></div></div>
            <span class="stat-text" id="shieldText">50</span>
        </div>
    </div>
    
    <div id="waveIndicator" class="hud">
        <div class="wave-text">WAVE <span id="waveNum">1</span></div>
        <div class="wave-enemies">Enemies: <span id="enemyCount">0/5</span></div>
    </div>
    
    <div id="scoreHud" class="hud">
        <div class="score-label">SCORE</div>
        <div class="score-value" id="scoreVal">0</div>
        <div class="kills-text">KILLS: <span id="killsVal">0</span></div>
    </div>
    
    <div id="weaponHud" class="hud"></div>
    
    <div id="ammoHud" class="hud">
        <div class="ammo-count" id="ammoVal">75</div>
        <div class="ammo-label">AMMO</div>
    </div>
    
    <div id="minimapHud" class="hud">
        <canvas id="minimap"></canvas>
    </div>
    
    <div id="crosshair">
        <div class="crosshair-dot"></div>
        <div class="crosshair-line top"></div>
        <div class="crosshair-line bottom"></div>
        <div class="crosshair-line left"></div>
        <div class="crosshair-line right"></div>
    </div>
    
    <div id="notification">🎯 NEW WEAPON!</div>
    <div id="damageOverlay"></div>

    <script>
    // ============================================
    // GAME CONFIGURATION
    // ============================================
    const TILE_SIZE = 64;
    const MAP_SIZE = 24;
    const FOV = Math.PI / 3;
    const RENDER_DIST = 20;
    
    const WEAPONS = [
        { id: 0, name: 'Revolver', icon: '🔫', damage: 25, fireRate: 400, ammo: 1, range: 15, unlocked: true },
        { id: 1, name: 'Knife', icon: '🔪', damage: 50, fireRate: 200, ammo: 0, range: 1.5, unlocked: false, melee: true },
        { id: 2, name: '.44 Magnum', icon: '💥', damage: 60, fireRate: 600, ammo: 1, range: 18, unlocked: false },
        { id: 3, name: 'Rifle', icon: '🔫', damage: 20, fireRate: 100, ammo: 1, range: 20, unlocked: false },
        { id: 4, name: 'Sniper', icon: '🎯', damage: 150, fireRate: 1200, ammo: 1, range: 25, unlocked: false },
        { id: 5, name: 'Katana', icon: '⚔️', damage: 80, fireRate: 300, ammo: 0, range: 2, unlocked: false, melee: true },
        { id: 6, name: 'Railgun', icon: '⚡', damage: 200, fireRate: 2000, ammo: 5, range: 30, unlocked: false },
    ];
    
    // ============================================
    // GAME STATE
    // ============================================
    let canvas, ctx, miniCanvas, miniCtx;
    let gameRunning = false;
    let map = [];
    
    let player = {
        x: 0, y: 0,
        angle: 0,
        health: 100, maxHealth: 100,
        shield: 50, maxShield: 100,
        weapon: 0,
        ammo: 75,
        score: 0,
        kills: 0,
        lastShot: 0,
        bobPhase: 0,
        shooting: false,
        shootFrame: 0,
    };
    
    let enemies = [];
    let bullets = [];
    let pickups = [];
    
    let keys = {};
    let mouse = { x: 0, y: 0, locked: false };
    
    let wave = 1;
    let enemiesPerWave = 5;
    let enemiesSpawned = 0;
    let enemiesKilled = 0;
    let lastSpawn = 0;
    
    // ============================================
    // MAZE GENERATION
    // ============================================
    function generateMaze() {
        // Initialize with walls
        map = [];
        for (let y = 0; y < MAP_SIZE; y++) {
            map[y] = [];
            for (let x = 0; x < MAP_SIZE; x++) {
                map[y][x] = 1;
            }
        }
        
        // Recursive backtracker maze generation
        const stack = [];
        const startX = 1, startY = 1;
        map[startY][startX] = 0;
        stack.push({ x: startX, y: startY });
        
        while (stack.length > 0) {
            const current = stack[stack.length - 1];
            const neighbors = [];
            
            const dirs = [
                { dx: 0, dy: -2 },
                { dx: 2, dy: 0 },
                { dx: 0, dy: 2 },
                { dx: -2, dy: 0 }
            ];
            
            for (const dir of dirs) {
                const nx = current.x + dir.dx;
                const ny = current.y + dir.dy;
                if (nx > 0 && nx < MAP_SIZE - 1 && ny > 0 && ny < MAP_SIZE - 1 && map[ny][nx] === 1) {
                    neighbors.push({ x: nx, y: ny, wx: current.x + dir.dx / 2, wy: current.y + dir.dy / 2 });
                }
            }
            
            if (neighbors.length > 0) {
                const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                map[next.wy][next.wx] = 0;
                map[next.y][next.x] = 0;
                stack.push({ x: next.x, y: next.y });
            } else {
                stack.pop();
            }
        }
        
        // Add some extra corridors for variety
        for (let i = 0; i < MAP_SIZE * 2; i++) {
            const x = 1 + Math.floor(Math.random() * (MAP_SIZE - 2));
            const y = 1 + Math.floor(Math.random() * (MAP_SIZE - 2));
            if (Math.random() < 0.3) map[y][x] = 0;
        }
        
        // Ensure spawn area is clear
        map[1][1] = 0;
        map[1][2] = 0;
        map[2][1] = 0;
        map[2][2] = 0;
    }
    
    // ============================================
    // INITIALIZATION
    // ============================================
    function init() {
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        miniCanvas = document.getElementById('minimap');
        miniCtx = miniCanvas.getContext('2d');
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Input
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key >= '1' && e.key <= '7') {
                const idx = parseInt(e.key) - 1;
                if (WEAPONS[idx]?.unlocked) {
                    player.weapon = idx;
                    updateWeaponHud();
                }
            }
        });
        document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        
        canvas.addEventListener('click', () => {
            if (!mouse.locked && gameRunning) {
                canvas.requestPointerLock();
            }
        });
        
        document.addEventListener('pointerlockchange', () => {
            mouse.locked = document.pointerLockElement === canvas;
        });
        
        document.addEventListener('mousemove', e => {
            if (mouse.locked && gameRunning) {
                player.angle += e.movementX * 0.002;
            }
        });
        
        document.addEventListener('mousedown', () => {
            if (gameRunning && mouse.locked) shoot();
        });
        
        updateWeaponHud();
    }
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        miniCanvas.width = 150;
        miniCanvas.height = 150;
    }
    
    function updateWeaponHud() {
        const hud = document.getElementById('weaponHud');
        hud.innerHTML = WEAPONS.map((w, i) => `
            <div class="weapon-slot ${w.unlocked ? '' : 'locked'} ${i === player.weapon ? 'active' : ''}">
                <span class="weapon-key">${i + 1}</span>
                <span>${w.icon}</span>
            </div>
        `).join('');
    }
    
    // ============================================
    // GAME CONTROLS
    // ============================================
    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        resetGame();
        gameRunning = true;
        requestAnimationFrame(gameLoop);
    }
    
    function restartGame() {
        document.getElementById('gameOverScreen').style.display = 'none';
        resetGame();
        gameRunning = true;
        requestAnimationFrame(gameLoop);
    }
    
    function resetGame() {
        generateMaze();
        
        player = {
            x: 1.5 * TILE_SIZE,
            y: 1.5 * TILE_SIZE,
            angle: 0,
            health: 100, maxHealth: 100,
            shield: 50, maxShield: 100,
            weapon: 0,
            ammo: 75,
            score: 0,
            kills: 0,
            lastShot: 0,
            bobPhase: 0,
            shooting: false,
            shootFrame: 0,
        };
        
        enemies = [];
        bullets = [];
        pickups = [];
        wave = 1;
        enemiesPerWave = 5;
        enemiesSpawned = 0;
        enemiesKilled = 0;
        
        WEAPONS.forEach((w, i) => w.unlocked = i === 0);
        updateWeaponHud();
        updateHud();
    }
    
    function gameOver() {
        gameRunning = false;
        document.exitPointerLock();
        document.getElementById('finalScore').textContent = player.score;
        document.getElementById('gameOverScreen').style.display = 'flex';
    }
    
    // ============================================
    // GAME LOOP
    // ============================================
    function gameLoop() {
        if (!gameRunning) return;
        
        update();
        render();
        
        requestAnimationFrame(gameLoop);
    }
    
    function update() {
        const now = Date.now();
        
        // Player movement
        const moveSpeed = keys['shift'] ? 4 : 2.5;
        let dx = 0, dy = 0;
        
        if (keys['w'] || keys['arrowup']) {
            dx += Math.cos(player.angle) * moveSpeed;
            dy += Math.sin(player.angle) * moveSpeed;
        }
        if (keys['s'] || keys['arrowdown']) {
            dx -= Math.cos(player.angle) * moveSpeed;
            dy -= Math.sin(player.angle) * moveSpeed;
        }
        if (keys['a'] || keys['arrowleft']) {
            dx += Math.cos(player.angle - Math.PI/2) * moveSpeed;
            dy += Math.sin(player.angle - Math.PI/2) * moveSpeed;
        }
        if (keys['d'] || keys['arrowright']) {
            dx += Math.cos(player.angle + Math.PI/2) * moveSpeed;
            dy += Math.sin(player.angle + Math.PI/2) * moveSpeed;
        }
        
        // Collision detection
        const newX = player.x + dx;
        const newY = player.y + dy;
        const margin = 10;
        
        if (!isWall(newX + margin, player.y) && !isWall(newX - margin, player.y)) {
            player.x = newX;
        }
        if (!isWall(player.x, newY + margin) && !isWall(player.x, newY - margin)) {
            player.y = newY;
        }
        
        // Head bob
        if (dx !== 0 || dy !== 0) {
            player.bobPhase += 0.15;
        }
        
        // Shooting animation
        if (player.shooting) {
            player.shootFrame++;
            if (player.shootFrame > 10) {
                player.shooting = false;
                player.shootFrame = 0;
            }
        }
        
        // Spawn enemies
        if (now - lastSpawn > 2000 && enemiesSpawned < enemiesPerWave) {
            spawnEnemy();
            lastSpawn = now;
        }
        
        // Update enemies
        updateEnemies();
        
        // Check wave completion
        if (enemiesKilled >= enemiesPerWave) {
            wave++;
            enemiesPerWave = 5 + wave * 3;
            enemiesSpawned = 0;
            enemiesKilled = 0;
            player.ammo += 30;
            showNotification(`⚡ WAVE ${wave}!`);
            
            // Unlock weapons
            if (wave === 2 && !WEAPONS[1].unlocked) { WEAPONS[1].unlocked = true; showNotification('🔪 KNIFE UNLOCKED!'); }
            if (wave === 3 && !WEAPONS[2].unlocked) { WEAPONS[2].unlocked = true; showNotification('💥 .44 UNLOCKED!'); }
            if (wave === 5 && !WEAPONS[3].unlocked) { WEAPONS[3].unlocked = true; showNotification('🔫 RIFLE UNLOCKED!'); }
            if (wave === 7 && !WEAPONS[4].unlocked) { WEAPONS[4].unlocked = true; showNotification('🎯 SNIPER UNLOCKED!'); }
            if (wave === 10 && !WEAPONS[5].unlocked) { WEAPONS[5].unlocked = true; showNotification('⚔️ KATANA UNLOCKED!'); }
            if (wave === 15 && !WEAPONS[6].unlocked) { WEAPONS[6].unlocked = true; showNotification('⚡ RAILGUN UNLOCKED!'); }
            updateWeaponHud();
        }
        
        updateHud();
    }
    
    function isWall(x, y) {
        const mapX = Math.floor(x / TILE_SIZE);
        const mapY = Math.floor(y / TILE_SIZE);
        if (mapX < 0 || mapX >= MAP_SIZE || mapY < 0 || mapY >= MAP_SIZE) return true;
        return map[mapY][mapX] === 1;
    }
    
    function shoot() {
        const weapon = WEAPONS[player.weapon];
        const now = Date.now();
        
        if (now - player.lastShot < weapon.fireRate) return;
        if (weapon.ammo > 0 && player.ammo < weapon.ammo) return;
        
        player.lastShot = now;
        player.shooting = true;
        player.shootFrame = 0;
        
        if (weapon.ammo > 0) player.ammo -= weapon.ammo;
        
        // Raycast to find target
        const hit = castRay(player.x, player.y, player.angle, weapon.range * TILE_SIZE);
        
        if (hit.enemy) {
            hit.enemy.health -= weapon.damage;
            if (hit.enemy.health <= 0) {
                killEnemy(hit.enemy);
            }
        }
    }
    
    function spawnEnemy() {
        // Find valid spawn position
        let attempts = 0;
        while (attempts < 50) {
            const x = 1 + Math.floor(Math.random() * (MAP_SIZE - 2));
            const y = 1 + Math.floor(Math.random() * (MAP_SIZE - 2));
            
            if (map[y][x] === 0) {
                const dist = Math.sqrt((x * TILE_SIZE - player.x) ** 2 + (y * TILE_SIZE - player.y) ** 2);
                if (dist > TILE_SIZE * 5) {
                    const types = [
                        { name: 'Drone', health: 30, speed: 1.5, damage: 5, color: '#ff3333', size: 0.4 },
                        { name: 'Sentinel', health: 80, speed: 1, damage: 10, color: '#ff8800', size: 0.6 },
                        { name: 'Goliath', health: 200, speed: 0.6, damage: 20, color: '#1a1a1a', size: 0.9 },
                    ];
                    
                    const typeIdx = Math.min(Math.floor(Math.random() * (1 + wave * 0.3)), 2);
                    const type = types[typeIdx];
                    
                    enemies.push({
                        x: (x + 0.5) * TILE_SIZE,
                        y: (y + 0.5) * TILE_SIZE,
                        ...type,
                        maxHealth: type.health * (1 + wave * 0.1),
                        health: type.health * (1 + wave * 0.1),
                        score: (typeIdx + 1) * 10 * wave,
                        lastAttack: 0,
                    });
                    
                    enemiesSpawned++;
                    return;
                }
            }
            attempts++;
        }
    }
    
    function updateEnemies() {
        const now = Date.now();
        
        enemies.forEach(enemy => {
            // Move towards player
            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist > TILE_SIZE * 0.8) {
                const moveX = (dx / dist) * enemy.speed;
                const moveY = (dy / dist) * enemy.speed;
                
                const newX = enemy.x + moveX;
                const newY = enemy.y + moveY;
                
                if (!isWall(newX, enemy.y)) enemy.x = newX;
                if (!isWall(enemy.x, newY)) enemy.y = newY;
            }
            
            // Attack player
            if (dist < TILE_SIZE && now - enemy.lastAttack > 1000) {
                enemy.lastAttack = now;
                
                if (player.shield > 0) {
                    player.shield = Math.max(0, player.shield - enemy.damage * 0.5);
                } else {
                    player.health -= enemy.damage;
                }
                
                document.getElementById('damageOverlay').style.opacity = '0.5';
                setTimeout(() => document.getElementById('damageOverlay').style.opacity = '0', 100);
                
                if (player.health <= 0) {
                    gameOver();
                }
            }
        });
    }
    
    function killEnemy(enemy) {
        const idx = enemies.indexOf(enemy);
        if (idx > -1) enemies.splice(idx, 1);
        
        player.kills++;
        player.score += enemy.score;
        enemiesKilled++;
    }
    
    function castRay(startX, startY, angle, maxDist) {
        const rayDirX = Math.cos(angle);
        const rayDirY = Math.sin(angle);
        
        let mapX = Math.floor(startX / TILE_SIZE);
        let mapY = Math.floor(startY / TILE_SIZE);
        
        const deltaDistX = Math.abs(1 / rayDirX);
        const deltaDistY = Math.abs(1 / rayDirY);
        
        let stepX, stepY;
        let sideDistX, sideDistY;
        
        if (rayDirX < 0) {
            stepX = -1;
            sideDistX = (startX / TILE_SIZE - mapX) * deltaDistX;
        } else {
            stepX = 1;
            sideDistX = (mapX + 1 - startX / TILE_SIZE) * deltaDistX;
        }
        
        if (rayDirY < 0) {
            stepY = -1;
            sideDistY = (startY / TILE_SIZE - mapY) * deltaDistY;
        } else {
            stepY = 1;
            sideDistY = (mapY + 1 - startY / TILE_SIZE) * deltaDistY;
        }
        
        let hit = false;
        let side = 0;
        let dist = 0;
        
        while (!hit && dist < maxDist / TILE_SIZE) {
            if (sideDistX < sideDistY) {
                sideDistX += deltaDistX;
                mapX += stepX;
                side = 0;
                dist = sideDistX - deltaDistX;
            } else {
                sideDistY += deltaDistY;
                mapY += stepY;
                side = 1;
                dist = sideDistY - deltaDistY;
            }
            
            if (mapX >= 0 && mapX < MAP_SIZE && mapY >= 0 && mapY < MAP_SIZE) {
                if (map[mapY][mapX] === 1) hit = true;
            } else {
                hit = true;
            }
        }
        
        // Check for enemy hits
        let hitEnemy = null;
        let enemyDist = Infinity;
        
        for (const enemy of enemies) {
            const eDist = Math.sqrt((enemy.x - startX) ** 2 + (enemy.y - startY) ** 2);
            if (eDist < maxDist && eDist < enemyDist) {
                // Check if enemy is in crosshair
                const angleToEnemy = Math.atan2(enemy.y - startY, enemy.x - startX);
                let angleDiff = Math.abs(angleToEnemy - angle);
                if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
                
                if (angleDiff < 0.15) {
                    hitEnemy = enemy;
                    enemyDist = eDist;
                }
            }
        }
        
        return {
            dist: dist * TILE_SIZE,
            side,
            mapX, mapY,
            enemy: hitEnemy,
        };
    }
    
    // ============================================
    // RENDERING
    // ============================================
    function render() {
        // Sky gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height / 2);
        skyGrad.addColorStop(0, '#1a0a0a');
        skyGrad.addColorStop(1, '#3a1515');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
        
        // Floor gradient
        const floorGrad = ctx.createLinearGradient(0, canvas.height / 2, 0, canvas.height);
        floorGrad.addColorStop(0, '#2a1a10');
        floorGrad.addColorStop(1, '#0a0805');
        ctx.fillStyle = floorGrad;
        ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);
        
        // Raycasting for walls
        const numRays = canvas.width;
        const bob = Math.sin(player.bobPhase) * 5;
        
        for (let i = 0; i < numRays; i++) {
            const rayAngle = player.angle - FOV / 2 + (i / numRays) * FOV;
            const ray = castRay(player.x, player.y, rayAngle, RENDER_DIST * TILE_SIZE);
            
            // Fix fisheye
            const correctedDist = ray.dist * Math.cos(rayAngle - player.angle);
            
            const wallHeight = (TILE_SIZE / correctedDist) * (canvas.height * 0.8);
            const wallTop = (canvas.height - wallHeight) / 2 + bob;
            
            // Wall color based on side and distance
            const shade = Math.max(0, 1 - correctedDist / (RENDER_DIST * TILE_SIZE));
            const baseColor = ray.side === 0 ? 40 : 30;
            const r = Math.floor(baseColor * shade + 20);
            const g = Math.floor(baseColor * 0.6 * shade + 10);
            const b = Math.floor(baseColor * 0.4 * shade + 5);
            
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.fillRect(i, wallTop, 1, wallHeight);
            
            // Wall edge glow
            if (ray.side === 0) {
                ctx.fillStyle = `rgba(255, 100, 50, ${shade * 0.1})`;
                ctx.fillRect(i, wallTop, 1, 3);
            }
        }
        
        // Render enemies (sprite-based)
        renderEnemies(bob);
        
        // Render weapon
        renderWeapon(bob);
        
        // Render minimap
        renderMinimap();
    }
    
    function renderEnemies(bob) {
        // Sort by distance
        const sortedEnemies = enemies.map(e => ({
            ...e,
            dist: Math.sqrt((e.x - player.x) ** 2 + (e.y - player.y) ** 2)
        })).sort((a, b) => b.dist - a.dist);
        
        for (const enemy of sortedEnemies) {
            const dx = enemy.x - player.x;
            const dy = enemy.y - player.y;
            const dist = enemy.dist;
            
            // Angle to enemy
            const angleToEnemy = Math.atan2(dy, dx);
            let relAngle = angleToEnemy - player.angle;
            while (relAngle > Math.PI) relAngle -= Math.PI * 2;
            while (relAngle < -Math.PI) relAngle += Math.PI * 2;
            
            // Check if in FOV
            if (Math.abs(relAngle) > FOV / 2 + 0.3) continue;
            if (dist > RENDER_DIST * TILE_SIZE) continue;
            
            // Screen position
            const screenX = canvas.width / 2 + (relAngle / FOV) * canvas.width;
            
            // Size based on distance
            const spriteHeight = (TILE_SIZE * enemy.size / dist) * canvas.height;
            const spriteWidth = spriteHeight * 0.6;
            const spriteY = canvas.height / 2 - spriteHeight / 2 + bob;
            
            // Draw robot enemy
            const isBoss = enemy.color === '#1a1a1a';
            const isMedium = enemy.color === '#ff8800';
            
            ctx.save();
            ctx.translate(screenX, spriteY + spriteHeight / 2);
            
            const s = spriteHeight / 2;
            
            // Glow
            const glowColor = isBoss ? 'rgba(255,0,0,0.3)' : (isMedium ? 'rgba(255,136,0,0.3)' : 'rgba(255,50,50,0.3)');
            ctx.shadowColor = isBoss ? '#ff0000' : enemy.color;
            ctx.shadowBlur = 20;
            
            // Body
            ctx.fillStyle = isBoss ? '#1a1a1a' : (isMedium ? '#4a3520' : '#4a2020');
            ctx.fillRect(-s * 0.3, -s * 0.4, s * 0.6, s * 0.8);
            
            // Head
            ctx.fillRect(-s * 0.2, -s * 0.7, s * 0.4, s * 0.3);
            
            // Eyes
            ctx.fillStyle = isBoss ? '#ff0000' : (isMedium ? '#ffaa00' : '#ff4444');
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 10;
            ctx.fillRect(-s * 0.15, -s * 0.6, s * 0.3, s * 0.08);
            
            // Arms
            ctx.shadowBlur = 0;
            ctx.fillStyle = isBoss ? '#1a1a1a' : (isMedium ? '#4a3520' : '#4a2020');
            ctx.fillRect(-s * 0.45, -s * 0.3, s * 0.12, s * 0.5);
            ctx.fillRect(s * 0.33, -s * 0.3, s * 0.12, s * 0.5);
            
            // Legs
            ctx.fillRect(-s * 0.25, s * 0.4, s * 0.18, s * 0.4);
            ctx.fillRect(s * 0.07, s * 0.4, s * 0.18, s * 0.4);
            
            // Health bar
            const barWidth = s * 0.8;
            const healthPct = enemy.health / enemy.maxHealth;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(-barWidth / 2, -s * 0.85, barWidth, s * 0.08);
            ctx.fillStyle = healthPct > 0.5 ? '#00ff6a' : healthPct > 0.25 ? '#f7ff00' : '#ff0044';
            ctx.fillRect(-barWidth / 2, -s * 0.85, barWidth * healthPct, s * 0.08);
            
            ctx.restore();
        }
    }
    
    function renderWeapon(bob) {
        const weapon = WEAPONS[player.weapon];
        const weaponY = canvas.height - 200 + bob + (player.shooting ? -20 + player.shootFrame * 4 : 0);
        const weaponX = canvas.width / 2;
        
        ctx.save();
        ctx.translate(weaponX, weaponY);
        
        // Gun base
        ctx.fillStyle = '#2a2a35';
        ctx.shadowColor = '#00f7ff';
        ctx.shadowBlur = player.shooting ? 30 : 10;
        
        ctx.beginPath();
        ctx.roundRect(-40, 0, 80, 120, 8);
        ctx.fill();
        
        // Barrel
        ctx.fillStyle = '#1a1a20';
        ctx.fillRect(-15, -60, 30, 70);
        
        // Muzzle flash
        if (player.shooting && player.shootFrame < 5) {
            ctx.fillStyle = '#ff6a00';
            ctx.shadowColor = '#ff6a00';
            ctx.shadowBlur = 40;
            ctx.beginPath();
            ctx.moveTo(0, -80);
            ctx.lineTo(-20, -60);
            ctx.lineTo(20, -60);
            ctx.closePath();
            ctx.fill();
        }
        
        // Weapon icon
        ctx.font = '40px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(weapon.icon, 0, 80);
        
        ctx.restore();
    }
    
    function renderMinimap() {
        const scale = 150 / MAP_SIZE;
        
        miniCtx.fillStyle = 'rgba(0,0,0,0.8)';
        miniCtx.fillRect(0, 0, 150, 150);
        
        // Draw walls
        for (let y = 0; y < MAP_SIZE; y++) {
            for (let x = 0; x < MAP_SIZE; x++) {
                if (map[y][x] === 1) {
                    miniCtx.fillStyle = '#333';
                    miniCtx.fillRect(x * scale, y * scale, scale, scale);
                }
            }
        }
        
        // Draw enemies
        miniCtx.fillStyle = '#ff3333';
        for (const enemy of enemies) {
            const ex = (enemy.x / TILE_SIZE) * scale;
            const ey = (enemy.y / TILE_SIZE) * scale;
            miniCtx.beginPath();
            miniCtx.arc(ex, ey, 3, 0, Math.PI * 2);
            miniCtx.fill();
        }
        
        // Draw player
        const px = (player.x / TILE_SIZE) * scale;
        const py = (player.y / TILE_SIZE) * scale;
        
        miniCtx.fillStyle = '#00f7ff';
        miniCtx.beginPath();
        miniCtx.arc(px, py, 4, 0, Math.PI * 2);
        miniCtx.fill();
        
        // Player direction
        miniCtx.strokeStyle = '#00f7ff';
        miniCtx.lineWidth = 2;
        miniCtx.beginPath();
        miniCtx.moveTo(px, py);
        miniCtx.lineTo(px + Math.cos(player.angle) * 10, py + Math.sin(player.angle) * 10);
        miniCtx.stroke();
    }
    
    function updateHud() {
        document.getElementById('healthFill').style.width = (player.health / player.maxHealth * 100) + '%';
        document.getElementById('healthText').textContent = Math.floor(player.health);
        document.getElementById('shieldFill').style.width = (player.shield / player.maxShield * 100) + '%';
        document.getElementById('shieldText').textContent = Math.floor(player.shield);
        document.getElementById('scoreVal').textContent = player.score;
        document.getElementById('killsVal').textContent = player.kills;
        document.getElementById('ammoVal').textContent = player.ammo;
        document.getElementById('waveNum').textContent = wave;
        document.getElementById('enemyCount').textContent = `${enemiesKilled}/${enemiesPerWave}`;
    }
    
    function showNotification(text) {
        const notif = document.getElementById('notification');
        notif.textContent = text;
        notif.classList.add('show');
        setTimeout(() => notif.classList.remove('show'), 2000);
    }
    
    window.addEventListener('load', init);
    </script>
